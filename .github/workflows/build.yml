name: Windows build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
      ui: ${{ steps.scope.outputs.ui }}
      network: ${{ steps.scope.outputs.network }}
      native_checks: ${{ steps.scope.outputs.native_checks }}
      packaging: ${{ steps.scope.outputs.packaging }}
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate change selection
        run: python3 tests/test-ci-plan.py
      - name: Select checks and packaging
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-plan.py
  windows-native:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Rust target
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native -> ../artifacts/native-target
          key: windows-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Windows worker
        shell: pwsh
        run: ./scripts/build-native.ps1 -Architectures ${{ matrix.arch }} -WorkersOnly
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Host2VMRelay-worker-${{ matrix.arch }}
          path: artifacts/native/
          if-no-files-found: error
  native:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/native-target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Rust targets
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native -> ../artifacts/native-target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Rust source and unit tests
        if: needs.plan.outputs.native_checks == 'true'
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path native/Cargo.toml --locked
      - name: Build static VM agents and optional integration worker
        env:
          WITH_CORE: ${{ needs.plan.outputs.network }}
        run: |
          if [ "$WITH_CORE" = true ]; then
            bash scripts/build-native-linux.sh --with-core
          else
            bash scripts/build-native-linux.sh
          fi
      - name: Check Rust SSH engine and both VM architectures
        if: needs.plan.outputs.native_checks == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server qemu-user
          sudo python3 tests/test-rust-engine.py
          python3 tests/test-native-agent.py artifacts/native/agents/h2vm-agent-linux-x64
          python3 tests/test-native-agent.py artifacts/native/agents/h2vm-agent-linux-arm64 --runner qemu-aarch64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Host2VMRelay-native
          path: artifacts/native/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Host2VMRelay-rust-checks
          path: artifacts/checks/rust/
  windows:
    needs: [plan, native, windows-native]
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Retain the exact source used by this build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/checks | Out-Null
          git archive --format=zip --output=artifacts/checks/source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source snapshot failed' }
          git rev-parse HEAD | Set-Content artifacts/checks/source-commit.txt
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src/packages.lock.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Host2VMRelay-native
          path: artifacts/native
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Host2VMRelay-worker-*
          merge-multiple: true
          path: artifacts/native
      - name: Assemble verified native bundles
        shell: pwsh
        run: ./scripts/build-native.ps1 -BundleOnly
      - name: Build and check application
        shell: pwsh
        env:
          CHECK_UI: ${{ needs.plan.outputs.ui }}
        run: |
          ./build.ps1
          ./scripts/test.ps1 -Smoke:($env:CHECK_UI -eq 'true')
      - name: Check native Windows transport and session lifecycle
        if: needs.plan.outputs.network == 'true'
        shell: pwsh
        run: dotnet run --project tests/TransportHarness/TransportHarness.csproj -c Release -- --local-check artifacts/checks/windows-transport.json
      - name: Check Windows Rust UDP helper protocol
        if: needs.plan.outputs.network == 'true'
        shell: pwsh
        run: |
          python tests/test-native-agent.py artifacts/native/tests/h2vm-agent.exe
          if ($LASTEXITCODE -ne 0) { throw 'UDP helper regression checks failed' }
      - name: Upload check results and layout screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Host2VMRelay-checks
          path: artifacts/checks/
      - name: Install packaging compiler
        if: needs.plan.outputs.packaging == 'true'
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') { throw 'Unexpected compiler signature' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno'
          $install = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /NOICONS /DIR=`"$compilerDir`"" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw 'Compiler installation failed' }
          "INNO_COMPILER=$compilerDir\ISCC.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish all architectures and offline installer
        if: needs.plan.outputs.packaging == 'true'
        shell: pwsh
        run: .\scripts\build-release.ps1 -Iscc $env:INNO_COMPILER
      - name: Check framework-dependent x64 application
        if: needs.plan.outputs.packaging == 'true'
        shell: pwsh
        run: |
          $result = Join-Path $PWD 'artifacts/checks/framework-dependent-self-test.txt'
          $test = Start-Process '.\artifacts\publish\installer\win-x64\Host2VMRelay.exe' -ArgumentList "--self-test `"$result`"" -WindowStyle Hidden -PassThru -Wait
          Get-Content $result
          if ($test.ExitCode -ne 0) { throw 'Framework-dependent self-test failed' }
      - name: Upload installer icon evidence
        if: always() && needs.plan.outputs.packaging == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Host2VMRelay-installer-icons
          path: artifacts/checks/installer-icon/
          if-no-files-found: ignore
      - name: Check packaged x64 and x86 applications
        if: needs.plan.outputs.packaging == 'true'
        shell: pwsh
        run: |
          foreach ($rid in @('win-x64','win-x86')) {
            $checkDir = Join-Path $PWD "artifacts/checks/packaged-$rid"
            New-Item -ItemType Directory -Force $checkDir | Out-Null
            $resultPath = Join-Path $checkDir 'self-test.txt'
            $test = Start-Process -FilePath ".\artifacts\publish\$rid\Host2VMRelay.exe" -ArgumentList "--self-test `"$resultPath`"" -PassThru -Wait
            Get-Content $resultPath
            if ($test.ExitCode -ne 0) { throw "Packaged self-test failed: $rid" }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.plan.outputs.packaging == 'true'
        with:
          name: Host2VMRelay-Windows
          path: artifacts/release/
          if-no-files-found: error
  network:
    needs: [plan, native]
    if: needs.plan.outputs.network == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src/packages.lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Host2VMRelay-native
          path: artifacts/native
      - name: Restore native executable permissions
        run: chmod +x artifacts/native/linux-x64/h2vm-core artifacts/native/linux-x64/h2vm-agent-linux-*
      - name: Build production transport integration harness
        run: dotnet build tests/TransportHarness/TransportHarness.csproj -c Release
      - name: Check Linux transport lifecycle
        run: dotnet run --project tests/TransportHarness/TransportHarness.csproj -c Release --no-build -- --local-check artifacts/checks/network/local-transport.json
      - name: Test transparent TUN, SSH and automatic host fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! test -x /usr/sbin/sshd; then sudo apt-get update -qq && sudo apt-get install -y openssh-server; fi
          sudo --preserve-env=GH_TOKEN,PATH python3 tests/test-transparent-network.py
      - name: Upload transport acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Host2VMRelay-network-checks
          path: artifacts/checks/network/
          if-no-files-found: ignore
  release:
    if: >-
      always() && needs.plan.outputs.publish == 'true' &&
      needs.windows.result == 'success' &&
      (needs.network.result == 'success' || needs.network.result == 'skipped')
    needs: [plan, windows, network]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Host2VMRelay-Windows
          path: artifacts/release
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [xml]$project = Get-Content src/Host2VMRelay.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"
          $assets = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          $existing = gh release view $tag --json isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            $metadata = $existing | ConvertFrom-Json
            if (!$metadata.isPrerelease) {
              Write-Host "Release $tag already exists; preserving its assets."
              "## Release publication skipped" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              "Release $tag already exists and was not overwritten. New build artifacts do not update this release. Increase the project version and update the release notes to publish a new version." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              exit 0
            }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$env:GITHUB_SHA" -F force=false
            if ($LASTEXITCODE -ne 0) { throw 'Release tag update failed' }
            gh release edit $tag --prerelease=false --latest --title "Host2VMRelay $tag" --notes-file docs/RELEASE_NOTES.md
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --latest --title "Host2VMRelay $tag" --notes-file docs/RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          "## Release published" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Host2VMRelay $tag published from commit $env:GITHUB_SHA with $($assets.Count) release assets." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
