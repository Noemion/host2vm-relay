name: Windows build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: dotnet build -c Release
      - name: Check rules and encrypted settings
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP 'self-test.txt'
          $test = Start-Process -FilePath '.\bin\Release\net8.0-windows\Host2VMRelay.exe' -ArgumentList "--self-test `"$resultPath`"" -PassThru -Wait
          Get-Content $resultPath
          if ($test.ExitCode -ne 0) { throw 'Self-test failed' }
          node test-script.cjs "$env:RUNNER_TEMP\mihomo-test.json"
          if ($LASTEXITCODE -ne 0) { throw 'Script test failed' }
      - name: Install packaging compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') { throw 'Unexpected compiler signature' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno'
          $install = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /NOICONS /DIR=`"$compilerDir`"" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw 'Compiler installation failed' }
          "INNO_COMPILER=$compilerDir\ISCC.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish all architectures and offline installer
        shell: pwsh
        run: .\build-release.ps1 -Iscc $env:INNO_COMPILER
      - name: Check packaged x64 and x86 applications
        shell: pwsh
        run: |
          foreach ($rid in @('win-x64','win-x86')) {
            $resultPath = Join-Path $env:RUNNER_TEMP "$rid-self-test.txt"
            $test = Start-Process -FilePath ".\artifacts\publish\$rid\Host2VMRelay.exe" -ArgumentList "--self-test `"$resultPath`"" -PassThru -Wait
            Get-Content $resultPath
            if ($test.ExitCode -ne 0) { throw "Packaged self-test failed: $rid" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Host2VMRelay-Windows
          path: artifacts/release/
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Host2VMRelay-Windows
          path: release
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [xml]$project = Get-Content Host2VMRelay.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"
          $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          $existing = gh release view $tag --json isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            $metadata = $existing | ConvertFrom-Json
            if (!$metadata.isPrerelease) { Write-Host "Release $tag already exists; preserving its assets."; exit 0 }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$env:GITHUB_SHA" -F force=false
            if ($LASTEXITCODE -ne 0) { throw 'Release tag update failed' }
            gh release edit $tag --prerelease=false --latest --title "Host2VM Relay $tag" --notes-file RELEASE_NOTES.md
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --latest --title "Host2VM Relay $tag" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
