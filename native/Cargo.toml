[workspace]
members = ["relay-core", "vm-agent"]
resolver = "2"

[workspace.package]
version = "0.6.11"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["io-util", "io-std", "net", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
